name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          version: latest-known
      - name: Install Python
        run: uv python install 3.12
      - name: Install dependencies
        run: uv sync --locked
      - name: Run Python tests
        run: uv run pytest -q
      - name: Check browser script syntax
        run: node --check app/static/app.js
