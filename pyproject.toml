[project]
name = "slothsort"
version = "0.2.0"
description = "A review-first Telegram chat folder organizer powered by open-weight AI."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "python-dotenv>=1,<2",
  "telethon>=1.45,<2",
  "uvicorn[standard]>=0.30,<1",
]

[dependency-groups]
dev = [
  "pytest>=8,<9",
  "pytest-asyncio>=0.24,<1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]
